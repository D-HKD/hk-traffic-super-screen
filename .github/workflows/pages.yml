name: Deploy to GitHub Pages

# 只在 main 有 push 時自動 build + 部署 dist/。
# 第一次用之前，要去 Settings → Pages → Source 揀「GitHub Actions」。

# 暫時只支援手動觸發：因為 Pages 目前仍設為「Deploy from a branch」，
# 自動跑會失敗（Get Pages site failed）。等 Settings → Pages → Source 轉做
# 「GitHub Actions」之後，才把下面的 push 觸發加返：
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck + tests + build
        run: pnpm check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
